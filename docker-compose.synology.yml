# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.synology.yml — Synology NAS (AVIORI) overrides
# Usage:
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.synology.yml \
#                  --env-file .env.production up -d
# ─────────────────────────────────────────────────────────────────────────────
version: "3.9"

services:
  postgres:
    volumes:
      - ${PGDATA_PATH:-/volume1/docker/ybot/pgdata}:/var/lib/postgresql/data

  valkey:
    volumes:
      - ${VALKEY_PATH:-/volume1/docker/ybot/valkey}:/data

  minio:
    volumes:
      - ${MINIO_PATH:-/volume1/docker/ybot/minio}:/data

  api:
    image: ghcr.io/tigges/yai/ybot-api:${IMAGE_TAG:-latest}
    # Ollama may run natively on NAS or another LAN machine
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Set to a Slack incoming-webhook URL (or any HTTP endpoint) to receive
      # a "YBot API is live at vX.Y.Z" notification on every container start.
      DEPLOY_WEBHOOK_URL: ${DEPLOY_WEBHOOK_URL:-}

  web:
    image: ghcr.io/tigges/yai/ybot-web:${IMAGE_TAG:-latest}

  caddy:
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_DATA_PATH:-/volume1/docker/ybot/caddy/data}:/data
      - ${CADDY_CONFIG_PATH:-/volume1/docker/ybot/caddy/config}:/config
    ports:
      # Synology DSM occupies port 80/443; shift to 8080/8443
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    extra_hosts:
      # Allow Caddy to reach Ollama running natively on the NAS host
      - "host.docker.internal:host-gateway"

  # ── Watchtower — automatic image updates ─────────────────────────────────
  # Watchtower watches the ybot-api and ybot-web containers, checks GHCR for
  # updated :latest images every 5 minutes, pulls them, and restarts the
  # affected services.  It also sends a notification to DEPLOY_WEBHOOK_URL
  # (Slack incoming webhook or any POST endpoint) whenever it updates.
  #
  # Required one-time setup on the NAS:
  #   1. Log Docker into GHCR so Watchtower can pull private images:
  #        docker login ghcr.io -u <github-username> -p <PAT-with-read:packages>
  #      (this writes credentials to /root/.docker/config.json)
  #   2. Set DEPLOY_WEBHOOK_URL in .env.production to a Slack webhook URL or
  #      any POST endpoint — e.g.:
  #        DEPLOY_WEBHOOK_URL=https://hooks.slack.com/services/T.../B.../xxx
  #
  watchtower:
    image: containrrr/watchtower:latest
    container_name: ybot-watchtower
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "5m", max-file: "2" }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount Docker credential store so Watchtower can pull from GHCR
      - /root/.docker/config.json:/config.json:ro
    environment:
      # Poll every 5 minutes (300 s)
      WATCHTOWER_POLL_INTERVAL: "300"
      # Remove old images after updating
      WATCHTOWER_CLEANUP: "true"
      # Only watch containers listed by name below
      WATCHTOWER_SCOPE: "ybot"
      # Notify via generic webhook (Slack-compatible POST body)
      WATCHTOWER_NOTIFICATION_URL: ${DEPLOY_WEBHOOK_URL:-}
      # Use shoutrrr generic webhook driver; Slack-compatible JSON body
      WATCHTOWER_NOTIFICATIONS: "shoutrrr"
      WATCHTOWER_NOTIFICATION_TITLE_TAG: "YBot NAS Deploy"
      # Timezone for log timestamps
      TZ: ${TZ:-UTC}
    # Only watch these two containers
    command: ybot-api ybot-web
    networks: [ybot-net]
