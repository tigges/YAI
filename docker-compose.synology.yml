# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.synology.yml — Synology NAS (AVIORI) overrides
#
# Project path on NAS: /volume1/docker/ybot
#
# Usage (must be run with sudo on Synology):
#   cd /volume1/docker/ybot
#   sudo docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.synology.yml \
#     --env-file .env.production \
#     up -d
# ─────────────────────────────────────────────────────────────────────────────
version: "3.9"

services:
  postgres:
    volumes:
      - ${PGDATA_PATH:-/volume1/docker/ybot/pgdata}:/var/lib/postgresql/data

  valkey:
    volumes:
      - ${VALKEY_PATH:-/volume1/docker/ybot/valkey}:/data

  minio:
    volumes:
      - ${MINIO_PATH:-/volume1/docker/ybot/minio}:/data

  api:
    image: ghcr.io/tigges/yai/ybot-api:${IMAGE_TAG:-latest}
    # Ollama may run natively on NAS or another LAN machine
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Set to a Slack incoming-webhook URL (or any HTTP endpoint) to receive
      # a "YBot API is live at vX.Y.Z" notification on every container start.
      DEPLOY_WEBHOOK_URL: ${DEPLOY_WEBHOOK_URL:-}
    # Label lets Watchtower target this container by scope
    labels:
      - "com.centurylinklabs.watchtower.scope=ybot"

  web:
    image: ghcr.io/tigges/yai/ybot-web:${IMAGE_TAG:-latest}
    labels:
      - "com.centurylinklabs.watchtower.scope=ybot"

  caddy:
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_DATA_PATH:-/volume1/docker/ybot/caddy/data}:/data
      - ${CADDY_CONFIG_PATH:-/volume1/docker/ybot/caddy/config}:/config
    ports:
      # Synology DSM occupies port 80/443; shift to 8080/8443
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    extra_hosts:
      # Allow Caddy to reach Ollama running natively on the NAS host
      - "host.docker.internal:host-gateway"

  # ── Watchtower — automatic image updates ─────────────────────────────────
  # Watches ybot-api and ybot-web (via scope label), checks GHCR for updated
  # :latest images every 5 minutes, pulls them, and restarts the containers.
  # Sends a notification to DEPLOY_WEBHOOK_URL when it updates.
  #
  # One-time NAS setup (run once after first deploy):
  #   1. Authenticate Docker to GHCR (stores creds in /root/.docker/config.json
  #      because all docker commands on this NAS require sudo):
  #        sudo docker login ghcr.io -u <github-username> -p <PAT-read:packages>
  #   2. Add to /volume1/docker/ybot/.env.production:
  #        DEPLOY_WEBHOOK_URL=https://hooks.slack.com/services/T.../B.../xxx
  #   3. Restart the stack:
  #        sudo docker compose -f docker-compose.yml -f docker-compose.synology.yml \
  #          --env-file .env.production up -d
  #
  watchtower:
    image: containrrr/watchtower:latest
    container_name: ybot-watchtower
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "5m", max-file: "2" }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # On Synology, docker commands require sudo so credentials are stored
      # under /root rather than the regular user's home directory.
      - /root/.docker/config.json:/config.json:ro
    environment:
      WATCHTOWER_POLL_INTERVAL: "300"        # check every 5 minutes
      WATCHTOWER_CLEANUP: "true"             # remove old images after update
      WATCHTOWER_LABEL_ENABLE: "true"        # only update labelled containers
      WATCHTOWER_SCOPE: "ybot"               # match the label above
      WATCHTOWER_NOTIFICATION_URL: ${DEPLOY_WEBHOOK_URL:-}
      WATCHTOWER_NOTIFICATIONS: "shoutrrr"
      TZ: ${TZ:-UTC}
    networks: [ybot-net]
