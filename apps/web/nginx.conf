# Marketing site and console share this image.
# botstudio.uk serves the landing page. Every other host, including
# app.botstudio.uk, serves the console. Keep the original Host header.

server {
    listen 80;
    server_name botstudio.uk www.botstudio.uk;
    root /usr/share/nginx/html;
    index landing.html;

    location / {
        try_files $uri /landing.html;
    }

    location ~* \.(js|css|png|svg|ico|woff2?|jpe?g|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}

server {
    listen 80 default_server;
    server_name app.botstudio.uk _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback. Do not use $uri/: the help pictures live in /help/,
    # and a directory with the same name as a client route otherwise
    # redirects to /help/ and returns 403 instead of the app.
    location / {
        try_files $uri /index.html;
    }

    location ~* \.(js|css|png|svg|ico|woff2?|jpe?g|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
