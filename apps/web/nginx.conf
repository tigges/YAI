server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback. Do not use $uri/: the help pictures live in /help/,
    # and a directory with the same name as a client route otherwise
    # redirects to /help/ and returns 403 instead of the app.
    location / {
        try_files $uri /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
