name: Build & Push Docker images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Override image tag (default: sha-<short>)"
        required: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/yai/ybot-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/yai/ybot-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          INPUT_TAG="${{ github.event.inputs.image_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── API image ────────────────────────────────────────────────────────────
      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.API_IMAGE }}:latest
          build-args: |
            APP_VERSION=1.1.0
            APP_BUILD_NUMBER=${{ github.run_number }}
            APP_GIT_SHA=${{ github.sha }}
            APP_BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # ── Web image ────────────────────────────────────────────────────────────
      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api/v1
            VITE_APP_VERSION=1.1.0
            VITE_BUILD_NUMBER=${{ github.run_number }}
            VITE_GIT_SHA=${{ github.sha }}
            VITE_BUILD_DATE=${{ github.event.head_commit.timestamp }}
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # ── Optional: SSH deploy to AVIORI ─────────────────────────────────────
      # Add these secrets in Settings → Secrets → Actions to enable auto-deploy:
      #   AVIORI_HOST  — NAS IP or hostname
      #   AVIORI_USER  — SSH user (e.g. admin)
      #   AVIORI_KEY   — private SSH key (contents of ~/.ssh/id_ed25519)
      #   AVIORI_PATH  — path to compose files, e.g. /volume1/docker/ybot/src
      # When secrets are absent the step is skipped (continue-on-error keeps
      # the build green while AVIORI is not yet configured).
      - name: Deploy to AVIORI
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AVIORI_HOST }}
          username: ${{ secrets.AVIORI_USER }}
          key: ${{ secrets.AVIORI_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.AVIORI_PATH }}"
            echo "Pulling images for tag ${{ steps.tag.outputs.tag }}..."
            IMAGE_TAG=${{ steps.tag.outputs.tag }} \
              docker compose -f docker-compose.yml \
                             -f docker-compose.synology.yml \
                             --env-file .env.production \
              pull api web
            echo "Running database migrations..."
            IMAGE_TAG=${{ steps.tag.outputs.tag }} \
              docker compose -f docker-compose.yml \
                             -f docker-compose.synology.yml \
                             --env-file .env.production \
              run --rm api sh -c '
                cd /app
                SCHEMA="packages/db/prisma/schema.prisma"
                node_modules/.bin/prisma migrate deploy --schema "$SCHEMA" 2>/dev/null \
                  || node_modules/.bin/prisma db push --schema "$SCHEMA"
              ' || true
            echo "Restarting services..."
            IMAGE_TAG=${{ steps.tag.outputs.tag }} \
              docker compose -f docker-compose.yml \
                             -f docker-compose.synology.yml \
                             --env-file .env.production \
              up -d --remove-orphans
            echo "Deploy complete."

      # ── Notify: images published to GHCR ───────────────────────────────────
      # Fires every time images are successfully pushed, regardless of whether
      # the AVIORI SSH deploy ran.  Requires the SLACK_DEPLOY_WEBHOOK secret to
      # be set in Settings → Secrets → Actions (Slack incoming-webhook URL or
      # any generic POST endpoint).  Step is skipped when the secret is absent.
      - name: Notify images published
        if: success() && secrets.SLACK_DEPLOY_WEBHOOK != ''
        env:
          HOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BUILD_DATE="${{ github.event.head_commit.timestamp }}"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          curl -s -o /dev/null -X POST "$HOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"📦 *YBot images pushed to GHCR* — tag \`${IMAGE_TAG}\` · build #${{ github.run_number }} · \`${SHORT_SHA}\`\n• API: \`${{ env.API_IMAGE }}:${IMAGE_TAG}\`\n• Web: \`${{ env.WEB_IMAGE }}:${IMAGE_TAG}\`\n• <${RUN_URL}|View CI run> — Watchtower will deploy to AVIORI within 5 min\"}"
