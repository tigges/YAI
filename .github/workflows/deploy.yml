name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma client
        run: pnpm --filter @ybot/db generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost/dummy

      - name: Build shared package
        run: pnpm --filter @ybot/shared build

      - name: Build web app
        run: pnpm --filter @ybot/web build
        env:
          VITE_DEMO_MODE: "true"
          VITE_API_URL: "/api/v1"
          VITE_BASE_PATH: "/YAI/"
          VITE_APP_VERSION: ${{ github.ref_name == 'main' && '1.1.0' || github.ref_name }}
          VITE_BUILD_NUMBER: ${{ github.run_number }}
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_BUILD_DATE: ${{ github.event.head_commit.timestamp }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
